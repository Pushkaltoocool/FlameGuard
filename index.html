<style id="css">:root{
  --bg:#E1E4E0; --panel:#F7F8F5; --panel-2:#ECEEE9; --ink:#1D2326; --muted:#5A6468; --line:#C6CCC6;
  --tape:#F2C230; --tape-ink:#2A2208; --fire:#D23A2A; --net:#2F6FDB; --sec:#7B52CC; --av:#2E8B6E; --other:#7E868A;
  --slab:#C9CDC6; --wall:#3A4347; --ok:#2E8B6E; --danger:#C43B2C; --shadow:0 6px 24px rgba(20,28,30,.14);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){

    --bg:#15191B; --panel:#1F2528; --panel-2:#272E31; --ink:#E6EAEB; --muted:#9AA5A9; --line:#363F43;
    --tape:#F2C230; --tape-ink:#2A2208; --fire:#F0594A; --net:#5C93F0; --sec:#A383E8; --av:#4DB693; --other:#9AA3A7;
    --slab:#3A4246; --wall:#C9D1D3; --ok:#4DB693; --danger:#F0594A; --shadow:0 6px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15191B; --panel:#1F2528; --panel-2:#272E31; --ink:#E6EAEB; --muted:#9AA5A9; --line:#363F43;
  --tape:#F2C230; --tape-ink:#2A2208; --fire:#F0594A; --net:#5C93F0; --sec:#A383E8; --av:#4DB693; --other:#9AA3A7;
  --slab:#3A4246; --wall:#C9D1D3; --ok:#4DB693; --danger:#F0594A; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--net);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font:700 21px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.01em;white-space:nowrap}
.brand span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font:600 14px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--muted);min-width:38px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 9px;font-size:13.5px}
.icon{width:16px;height:16px;flex:none}
.stage{position:relative;min-height:0;overflow:hidden}
#gl{position:absolute;inset:0;touch-action:none;display:block}
.drawer,.inspector{position:absolute;top:12px;bottom:12px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:3}
.drawer{left:12px}
.inspector{right:12px}
.inspector[hidden],.drawer[hidden]{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel-2)}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;font:600 14.5px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.pane{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.sheet-close{display:none}
h3{font:600 17px/1.15 "Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:14px 0 6px}
h3:first-child{margin-top:0}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.type{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 8px;font-size:13.5px;line-height:1.2}
.type:hover{background:var(--panel-2)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--c)}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:7px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--panel-2)}
.row.sel{background:color-mix(in srgb,var(--tape) 28%,transparent)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font:600 13px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--muted)}
.floorhead{font:600 13.5px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--muted);margin:12px 6px 4px}
.search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--panel-2);font-size:13px}
.toggle{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
.toggle input{width:17px;height:17px;accent-color:var(--ink)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 3px}
.inp{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
textarea.inp{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font:600 15px/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;padding:4px 9px 3px;border-radius:2px;transform:rotate(-1.2deg);box-shadow:0 1px 2px rgba(0,0,0,.2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.insp-head .tape{flex:0 1 auto}
.insp-head .x{margin-left:auto;border:0;background:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center}
.insp-head .x:hover{background:var(--panel-2)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.linkrow{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 0}
.linkrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo{font:500 12.5px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--muted)}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 10px 9px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);z-index:6;max-width:min(560px,calc(100% - 24px));font-size:14px}
.toast[hidden]{display:none}
.toast button{background:none;border:1px solid color-mix(in srgb,var(--panel) 40%,transparent);color:var(--panel);border-radius:7px;padding:4px 10px;white-space:nowrap}
.status{position:absolute;left:324px;bottom:14px;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 9px;border-radius:7px;z-index:2;pointer-events:none}
.status.dirty{color:var(--ink)}
.status.dirty::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tape);margin-right:6px;vertical-align:1px}
.tag{position:absolute;pointer-events:none;z-index:2;transform:translate(-50%,-150%)}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 14px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);z-index:7;font-size:14px;max-width:calc(100% - 24px)}
.banner[hidden]{display:none}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:13.5px;align-items:center}
.ring{width:14px;height:14px;border-radius:50%;border:3px solid var(--c)}
.range{width:100%;accent-color:var(--ink)}
.bottomnav{display:none}
.empty{color:var(--muted);font-size:14px;padding:10px 4px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:min(560px,92vw);width:100%;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog textarea{width:100%;height:240px;font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace}
@media (max-width:760px){
  .top{gap:6px;padding:6px 8px}
  .brand b{font-size:18px}
  .seg button{min-width:32px;padding:5px 7px}
  .btn{padding:6px 8px}
  .brand span{display:none}
  .top .hide-sm{display:none}
  .drawer,.inspector{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58%;border-radius:14px 14px 0 0;border-bottom:0}
  .drawer{bottom:56px;max-height:calc(58% - 56px)}
  .drawer .tabs{display:none}
  .sheet-close{display:inline-grid}
  .bottomnav{display:flex;position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--panel);border-top:1px solid var(--line);z-index:4}

  .inspector{z-index:5}
  .status{left:10px;bottom:66px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.inspector:not([hidden])~#mini{right:324px}
#joy{position:absolute;left:22px;bottom:84px;width:120px;height:120px;border-radius:50%;background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);z-index:3;touch-action:none}
#joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transform:translate(-50%,-50%)}
.walkhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:9px 10px 9px 14px;font-size:14px;max-width:min(560px,calc(100% - 220px));z-index:3;display:flex;gap:10px;align-items:center}
.walkhint[hidden]{display:none}
.stairbtn{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);z-index:3;font-size:15px;padding:9px 16px}
.stairbtn span{cursor:pointer}
.stairbtn[hidden]{display:none}
#walkbtn[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
@media (max-width:760px){
  #mini{width:118px;height:118px;top:8px;right:8px}
  .inspector:not([hidden])~#mini{right:8px}
  .walkhint{top:auto;bottom:212px;max-width:calc(100% - 24px);font-size:13.5px}
  #joy{bottom:72px;left:16px}
  .stairbtn{bottom:208px}
}
.brand b span{font:inherit;color:inherit}
.btn:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}
.walking #topview{display:none}
@media (max-width:760px){
  .walkhint{left:12px;right:12px;transform:none;max-width:none}
  .walking .status{display:none}
  #walkbtn .lg{display:none}
}
@media (min-width:761px){#walkbtn .sm{display:none}}

  clearTimeout(draftT);draftT=setTimeout(()=>{try{localStorage.setItem('w19w-layout-draft',JSON.stringify({base:state.savedAt,state}))}catch(e){}},400);
}
function renderStatus(){
  const el=$('#status');
  const when=state.savedAt?new Date(state.savedAt).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):null;
  el.className='status'+(dirty?' dirty':'');
  el.textContent=dirty?'Unsaved changes':(when?'Saved '+when:'Starting layout – not saved yet');
}
function checkDraft(){
  let dr=null;try{dr=JSON.parse(localStorage.getItem('w19w-layout-draft')||'null')}catch(e){}
  if(!dr)return;
  if(dr.pending&&dr.pending===state.savedAt){try{localStorage.removeItem('w19w-layout-draft')}catch(e){}return}
  if(JSON.stringify(dr.state.devices)===JSON.stringify(state.devices)&&JSON.stringify(dr.state.links)===JSON.stringify(state.links))return;
  const ban=$('#banner');ban.hidden=false;
  ban.innerHTML='<span>You have edits from an earlier visit that weren’t saved.</span><button class="btn small" id="b-restore">Restore</button><button class="btn small" id="b-discard">Discard</button>';
  $('#b-restore').onclick=()=>{snapshot();state.devices=dr.state.devices;state.links=dr.state.links;rebuildAll();renderDrawer();ban.hidden=true;changed()};
  $('#b-discard').onclick=()=>{try{localStorage.removeItem('w19w-layout-draft')}catch(e){}ban.hidden=true};
}

/* ---------- save / export / import ---------- */
function pageHTML(next){
  const E='</'+'script>';
  const j=JSON.stringify(next).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n'+HEAD+'<style id="css">'+SRC.css+'</style>\n</head>\n<body>\n<div id="app"></div>\n<script type="application/json" id="layout">'+j+E+'\n<script type="application/json" id="building">'+SRC.building+E+'\n<script src="'+THREE_URL+'">'+E+'\n<script src="'+ORBIT_URL+'">'+E+'\n<script id="main">'+SRC.main+E+'\n</body>\n</html>\n';
}
let artifactCap=null,readOnly=false;
if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(a=>{artifactCap=a}).catch(()=>{});
}
async function saveLayout(){
  if(readOnly){toast('This view is read-only. Use Export in the View tab to keep a copy.');return}
  if(!artifactCap){const next=Object.assign({},state,{savedAt:new Date().toISOString()});const blob=new Blob([pageHTML(next)],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);try{localStorage.setItem('w19w-layout-draft',JSON.stringify({base:state.savedAt,pending:next.savedAt,state}))}catch(e){}dirty=false;renderStatus();toast('Saved as a new index.html in your Downloads. Put it in this folder (replacing the old one) to keep your changes.');return}
  const next=Object.assign({},state,{savedAt:new Date().toISOString(),version:(state.version||1)});
  try{localStorage.setItem('w19w-layout-draft',JSON.stringify({base:state.savedAt,pending:next.savedAt,state}))}catch(e){}
  const btn=$('#save');btn.disabled=true;btn.textContent='Saving…';
  try{await artifactCap.publish(pageHTML(next));btn.textContent='Saved'}
  catch(err){
    btn.disabled=false;btn.innerHTML='Save<span class="hide-sm">layout</span>';
    const code=err&&err.code;
    if(code==='conflict'){toast('Someone else saved first. The page is reloading to their version – your edits are kept as a draft you can restore.')}
    else if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='consent_required'||code==='capability_disabled'||code==='capability_removed'){readOnly=true;btn.disabled=true;btn.textContent='View only';toast('You can view this layout but not save it. Use Export to keep a copy.')}
    else if(code==='rate_limited'){toast('Saved too often. Wait a moment, then save again.')}
    else if(code==='too_large'){toast('The layout is too large to save. Remove some items or export it instead.')}
    else{toast('Saving failed ('+(code||'unknown')+'). Your edits are still here – try again.')}
  }
}
async function exportJSON(){
  const data=JSON.stringify({building:'W19 Endicott',exported:new Date().toISOString(),devices:state.devices,links:state.links},null,2);
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:'w19-layout.json',data});toast('Exported w19-layout.json.');return}catch(e){if(e&&e.code==='declined')return}}
  if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='w19-layout.json';document.body.appendChild(a);a.click();a.remove();toast('Exported w19-layout.json to your Downloads.');return}
  const dlg=$('#dlg');dlg.innerHTML='<h3>Layout data</h3><p class="hint">Copy this text and keep it as a .json file.</p><textarea readonly>'+esc(data)+'</textarea><div class="actions"><button class="btn" id="dlg-copy">Copy</button><button class="btn primary" id="dlg-close">Close</button></div>';
  dlg.showModal();$('#dlg-close').onclick=()=>dlg.close();
  $('#dlg-copy').onclick=()=>{const t=dlg.querySelector('textarea');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand&&document.execCommand('copy')}toast('Copied.')};
}
function importJSON(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const j=JSON.parse(fr.result);if(!Array.isArray(j.devices))throw 0;snapshot();state.devices=j.devices;state.links=Array.isArray(j.links)?j.links:[];selId=null;rebuildAll();renderDrawer();renderInspector();changed();toast('Imported '+j.devices.length+' devices.')}catch(e){toast('That file isn’t a W19 layout export.')}};
  fr.readAsText(file);
}

/* ---------- toast ---------- */
const toastEl=$('#toast');let toastT=null;
function toast(msg,actions){
  clearTimeout(toastT);toastEl.hidden=false;toastEl.innerHTML='<span>'+esc(msg)+'</span>';
  (actions||[]).forEach(([lab,fn])=>{const b=document.createElement('button');b.textContent=lab;b.onclick=fn;toastEl.appendChild(b)});
  if(!actions||!actions.length)toastT=setTimeout(hideToast,4200);
}
function hideToast(){toastEl.hidden=true}
function cancelMode(){mode=null;hideToast()}
function startPlace(type,id){

  if(prefs.floor===0&&id){const d=byId(id);if(d&&d.f)setFloor(d.f)}

let listQ='';
function rowHTML(d,tray){
  const ty=typeOf(d),cat=CATS[ty.c];
  return '<div class="row'+(d.id===selId?' sel':'')+'" data-row="'+d.id+'" role="button" tabindex="0"><span class="dot" style="--c:var('+cat.v+')"></span><span class="t"><b>'+esc(nameOf(d))+'</b><small>'+esc(tray?(d.notes||''):(d.f+'F – '+roomAt(d)+(d.label?' – '+ty.n:'')))+'</small></span>'+(d.photo?'<span class="photo">'+esc(d.photo.replace('IMG_',''))+'</span>':'')+((d.count||1)>1?'<span class="cnt">×'+d.count+'</span>':'')+(tray?'<button class="btn small" data-place="'+d.id+'">Place</button>':'')+'</div>';
}
function renderList(){
  const q=listQ.trim().toLowerCase();
  const ds=state.devices.filter(d=>d.placed&&(!q||[nameOf(d),typeOf(d).n,d.notes,d.photo,d.label].join(' ').toLowerCase().includes(q)));
  const tot={};ds.forEach(d=>{const c=typeOf(d).c;tot[c]=(tot[c]||0)+(d.count||1)});
  let h='<div class="chips">'+Object.entries(CATS).filter(([k])=>tot[k]).map(([k,c])=>'<span class="chip"><span class="dot" style="--c:var('+c.v+')"></span>'+c.name+' '+tot[k]+'</span>').join('')+'</div>';
  for(const f of [1,2,3]){
    const g=ds.filter(d=>d.f===f);if(!g.length)continue;
    const byT={};g.forEach(d=>{(byT[d.t]=byT[d.t]||[]).push(d)});
    h+='<div class="floorhead">'+f+'F – '+g.reduce((s,d)=>s+(d.count||1),0)+' items</div>';
    for(const [t,arr] of Object.entries(byT))h+=arr.map(d=>rowHTML(d,false)).join('');
  }
  if(!ds.length)h+='<p class="empty">No devices match.</p>';
  $('#listbody').innerHTML=h;
  $('#listbody').querySelectorAll('[data-row]').forEach(b=>{b.onclick=()=>select(b.dataset.row);b.onkeydown=e=>{if(e.key==='Enter')select(b.dataset.row)}});

function exitWalk(){
  $('#povbtn').hidden=true;avatar.visible=false;
  walkOn=false;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));resize();solid.visible=false;scene.fog=null;scene.background=new THREE.Color(cssv('--bg'));
  for(const k in keys)keys[k]=false;joy.x=joy.y=0;
  buildBuilding();Object.values(deviceObjs).forEach(o=>placeDeviceObj(byId(o.userData.id)));updateSel();
  prefs.floor=player.f;savePrefs();applyFloorVisibility();
  $('#walkbtn').setAttribute('aria-pressed','false');$('#walkbtn .lg').textContent='Walk';$('#walkbtn .sm').textContent='Walk';document.body.classList.remove('walking');$('#topview').disabled=false;
  mini.hidden=true;joyEl.hidden=true;$('#stairbtn').hidden=true;$('#walkhint').hidden=true;stairState=undefined;
  if(!isSmall()){drawerOpen=true;renderDrawer();$('#panelbtn').hidden=true}
}
$('#walkbtn').onclick=()=>{if(walkOn)exitWalk();else enterWalk()};
$('#povbtn').onclick=()=>setPOV(!thirdPerson);
window.addEventListener('keydown',e=>{if(walkOn&&e.code==='KeyV'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName))setPOV(!thirdPerson)});
$('#panelbtn').onclick=()=>{drawerOpen=!drawerOpen;renderDrawer()};
scene.background=new THREE.Color(cssv('--bg'));
resize();buildBuilding();rebuildAll();renderDrawer();renderStatus();checkDraft();
if(isSmall()&&prefs.floor===0)setFloor(1);else applyFloorVisibility();
loop();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildBuilding();Object.values(deviceObjs).forEach(o=>placeDeviceObj(byId(o.userData.id)))});
})();
</script>
</body>
</html>
